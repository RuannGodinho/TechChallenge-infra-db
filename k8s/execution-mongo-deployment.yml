apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-mongo-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: execution-mongo
  template:
    metadata:
      labels:
        app: execution-mongo
    spec:
      containers:
        - name: mongo
          image: 'mongo:8'
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          args:
            - '--replSet'
            - execution-rs
            - '--bind_ip_all'
          readinessProbe:
            exec:
              command:
                - mongosh
                - '--quiet'
                - '--eval'
                - 'quit(db.hello().isWritablePrimary ? 0 : 1)'
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: execution-mongo-pvc
  strategy:
    type: Recreate
